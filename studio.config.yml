# ITGo Studio (Sveltia) — site-config for denne starter.
# Backend (git-gateway via ITGo Studio) + branding udfyldes pr. kunde ved onboarding (Phase B).
# Collections matcher content-modellen i src/content.config.ts (blocks-union).
#
# Kunden ser dette som "ITGo Studio" på studio.itgo.dk — aldrig Sveltia/GitHub direkte.

# backend: udfyldes pr. kunde (B2 git-gateway).
# backend: { name: github, repo: It-go/<kunde-repo>, branch: main, base_url: https://gateway.studio.itgo.dk }

# Branding — kunden ser ITGo Studio. Overstyr pr. kunde ved onboarding (logo/navn).
app_title: ITGo Studio
logo:
  src: /studio-logo.svg
  show_in_header: true

media_folder: "public/uploads"
public_folder: "/uploads"

i18n:
  structure: multiple_folders
  locales: [da, en]
  default_locale: da

collections:
  # Site-indstillinger — kundens globale kontrolpanel (firma/kontakt). Ét entry, læses af Astro.
  # Matcher `settings`-collection i src/content.config.ts (check:model holder dem 1:1).
  - name: settings
    label: Indstillinger
    label_singular: Site-indstilling
    files:
      - name: site
        label: Firma & kontakt
        file: src/content/settings/site.yml
        hint: "Firmaoplysninger der vises overalt på sitet (fx footer). Gælder begge sprog."
        fields:
          - { name: company, label: Firmanavn, widget: string, hint: "Vises i footer og som afsender." }
          - { name: cvr, label: CVR-nummer, widget: string, required: false, hint: "Vises i footer (god skik/lovkrav for danske virksomheder)." }
          - { name: address, label: Adresse, widget: string, required: false, hint: "Gade, postnr. og by." }
          - { name: phone, label: Telefon, widget: string, required: false }
          - { name: email, label: E-mail, widget: string, required: false }
          - name: opening_hours
            label: Åbningstider
            widget: list
            required: false
            hint: "Én linje pr. interval, fx 'Man–fre' → '08–16'."
            fields:
              - { name: day, label: Dag(e), widget: string }
              - { name: hours, label: Tid, widget: string }
          - name: social
            label: Sociale links
            widget: object
            required: false
            collapsed: true
            hint: "Fulde URL'er. Tomme felter skjules på sitet."
            fields:
              - { name: facebook, label: Facebook, widget: string, required: false }
              - { name: instagram, label: Instagram, widget: string, required: false }
              - { name: linkedin, label: LinkedIn, widget: string, required: false }
          - { name: logo, label: Logo, widget: image, required: false, hint: "Bruges hvor temaet understøtter logo (header/footer)." }
          # SEO / Google structured data (STD-8) — bruges til LocalBusiness-rich-results.
          - { name: business_type, label: Branche (Google), widget: select, required: false, default: LocalBusiness, options: [LocalBusiness, HomeAndConstructionBusiness, GeneralContractor, Electrician, Plumber, RoofingContractor, HVACBusiness, Locksmith, MovingCompany, ProfessionalService, Store, SportsClub, SportsActivityLocation], hint: "Vælg den der bedst beskriver virksomheden — styrer Googles structured data." }
          - name: geo
            label: Geo-placering
            widget: object
            required: false
            collapsed: true
            hint: "Bredde-/længdegrad (valgfri) — viser virksomheden korrekt på Google-kort."
            fields:
              - { name: latitude, label: Breddegrad (lat), widget: string, required: false }
              - { name: longitude, label: Længdegrad (lng), widget: string, required: false }
          - { name: price_range, label: Prisniveau, widget: string, required: false, hint: "Fx '$$' — vises som priceRange i Google." }
          # Navigation (STD-3) — træk for at sortere. Renderes som site-header + mobil-menu.
          - name: menu
            label: Menu (navigation)
            label_singular: Menupunkt
            widget: list
            required: false
            hint: "Træk for at sortere. Link: intern side ('om-os' eller tom = forsiden) eller fuld URL (https://…)."
            fields:
              - { name: label, label: Tekst (dansk), widget: string }
              - { name: label_en, label: Tekst (engelsk), widget: string, required: false, hint: "Valgfri — bruges på engelske sider. Tom = samme som dansk." }
              - { name: link, label: Link, widget: string, required: false, hint: "Intern: 'om-os' eller tom = forside. Ekstern: https://…" }
          # Scripts & tags (STD-4) — indsæt id; scriptet loader først EFTER cookie-samtykke (STD-5).
          - name: tracking
            label: Scripts & tags
            widget: object
            required: false
            collapsed: true
            hint: "Tracking-id'er. Tomt felt = slået fra. Marketing/statistik kører først efter samtykke."
            fields:
              - { name: ga4_id, label: Google Analytics 4 (G-…), widget: string, required: false, hint: "Statistik — kører efter samtykke." }
              - { name: gtm_id, label: Google Tag Manager (GTM-…), widget: string, required: false, hint: "Marketing — kører efter samtykke." }
              - { name: meta_pixel_id, label: Meta Pixel (id), widget: string, required: false, hint: "Marketing — kører efter samtykke." }
          # Cookie-consent (STD-5) — slå banner til; det gater STD-4's scripts.
          - name: consent
            label: Cookie-samtykke
            widget: object
            required: false
            collapsed: true
            hint: "GDPR cookie-banner. Slå til når du bruger tracking (STD-4)."
            fields:
              - { name: enabled, label: Vis cookie-banner, widget: boolean, default: false, hint: "Til = banner vises og gater scripts indtil samtykke." }
              - { name: message, label: Banner-tekst (dansk), widget: text, required: false, hint: "Valgfri — ellers bruges en standardtekst." }
              - { name: message_en, label: Banner-tekst (engelsk), widget: text, required: false }
              - { name: policy_url, label: Link til privatlivspolitik, widget: string, required: false, hint: "Fx /privatlivspolitik (kommer i STD-6)." }
              - { name: log_url, label: Consent-log endpoint (avanceret), widget: string, required: false, hint: "Valgfri URL der modtager samtykke-log (sendBeacon). Tom = kun lokal log." }
          # 301/302-redirects (STD-7) → Cloudflare Pages _redirects ved build.
          - name: redirects
            label: Viderestillinger (redirects)
            label_singular: Viderestilling
            widget: list
            required: false
            hint: "Send en gammel sti til en ny. Brug ved ændrede URL'er, så links + Google ikke rammer en 404."
            fields:
              - { name: from, label: Fra-sti, widget: string, hint: "Gammel sti, fx /gammel-side" }
              - { name: to, label: Til-sti/URL, widget: string, hint: "Ny sti, fx /ny-side, eller fuld URL" }
              - { name: permanent, label: "Permanent (301)", widget: boolean, default: true, hint: "Til = 301 (permanent). Fra = 302 (midlertidig)." }
          # Privacy-venlig statistik (STD-9) — cookieløs Cloudflare Web Analytics.
          - name: analytics
            label: Besøgsstatistik
            widget: object
            required: false
            collapsed: true
            hint: "Cookieløs statistik (intet samtykke nødvendigt). Token hentes i Cloudflare → Web Analytics."
            fields:
              - { name: cf_web_analytics_token, label: Cloudflare Web Analytics-token, widget: string, required: false, hint: "Token fra Cloudflare Web Analytics. Tom = slået fra." }

  - name: pages
    label: Sider
    label_singular: Side
    folder: src/content/pages
    create: true
    format: yaml-frontmatter
    slug: "{{slug}}"
    i18n: true
    identifier_field: title
    fields:
      - { name: title, label: Titel, widget: string, i18n: true, hint: "Sidens titel — vises i browserfanen og typisk som overskrift." }
      - name: seo
        label: SEO
        widget: object
        required: false
        collapsed: true
        hint: "Hvordan siden ser ud i Google og når den deles. Lad felterne stå tomme for at bruge sidens egen titel."
        fields:
          - { name: title, label: SEO-titel, widget: string, required: false, i18n: true }
          - { name: description, label: Beskrivelse, widget: text, required: false, i18n: true, hint: "1-2 sætninger der vises under titlen i Google." }
          - { name: og_image, label: OG-billede, widget: image, required: false, hint: "Billede der vises når siden deles på fx Facebook/LinkedIn." }
      - name: blocks
        label: Sektioner
        label_singular: Sektion
        widget: list
        hint: "Byg siden af sektioner. Tilføj, fjern og træk for at ændre rækkefølgen."
        types:
          - name: hero
            label: Hero
            widget: object
            hint: "Det store banner øverst på siden — overskrift, evt. billede og en knap."
            fields:
              - { name: heading, label: Overskrift, widget: string, i18n: true }
              - { name: subheading, label: Underoverskrift, widget: string, required: false, i18n: true }
              - { name: image, label: Billede, widget: image, required: false }
              - { name: cta_label, label: CTA-tekst, widget: string, required: false, i18n: true, hint: "Teksten på knappen, fx 'Kontakt os'." }
              - { name: cta_href, label: CTA-link, widget: string, required: false, hint: "Hvor knappen fører hen, fx /kontakt eller https://…" }
          - name: text
            label: Tekst
            widget: object
            hint: "En tekstsektion med overskrift og brødtekst."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - { name: body, label: Brødtekst, widget: markdown, i18n: true }
          - name: image_grid
            label: Billed-grid
            widget: object
            hint: "Billeder i et gitter — fx galleri, referencer eller logoer."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - { name: columns, label: Kolonner, widget: number, default: 3, min: 1, max: 6, hint: "Antal billeder pr. række (1-6)." }
              - name: images
                label: Billeder
                widget: list
                fields:
                  - { name: src, label: Billede, widget: image }
                  - { name: alt, label: Alt-tekst, widget: string, required: false, i18n: true, hint: "Kort beskrivelse af billedet (for skærmlæsere og Google)." }
          - name: faq
            label: FAQ
            widget: object
            hint: "Ofte stillede spørgsmål med svar der kan foldes ud."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - name: items
                label: Spørgsmål
                widget: list
                fields:
                  - { name: q, label: Spørgsmål, widget: string, i18n: true }
                  - { name: a, label: Svar, widget: text, i18n: true }
          - name: contact_form
            label: Kontakt-form
            widget: object
            hint: "En kontaktformular. Indsendelser sendes til jer."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - { name: submit_label, label: Send-knap, widget: string, default: Send, i18n: true }
              - { name: form_key, label: Form-nøgle, widget: string, default: contact, hint: "Teknisk id der samler indsendelserne. Lad stå som det er." }
              - name: fields
                label: Felter
                widget: list
                hint: "Felterne i formularen (fx navn, e-mail, besked)."
                fields:
                  - { name: name, label: Navn (teknisk), widget: string, hint: "Teknisk feltnavn uden mellemrum/æøå — vises ikke til besøgende." }
                  - { name: label, label: Label, widget: string, i18n: true }
                  - { name: type, label: Type, widget: select, options: [text, email, tel, textarea], default: text }
                  - { name: required, label: Påkrævet, widget: boolean, default: false }
          - name: testimonials
            label: Anbefalinger
            widget: object
            hint: "Citater og anbefalinger fra kunder."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - name: items
                label: Citater
                widget: list
                fields:
                  - { name: quote, label: Citat, widget: text, i18n: true }
                  - { name: author, label: Forfatter, widget: string, required: false }
          - name: cta
            label: Call-to-action
            widget: object
            hint: "Opfordring til handling — kort tekst og en knap."
            fields:
              - { name: heading, label: Overskrift, widget: string, i18n: true }
              - { name: body, label: Tekst, widget: string, required: false, i18n: true }
              - { name: button_label, label: Knap-tekst, widget: string, required: false, i18n: true }
              - { name: button_href, label: Knap-link, widget: string, required: false, hint: "Hvor knappen fører hen, fx /kontakt." }
          - name: click_to_call
            label: Ring nu (klik-til-ring)
            widget: object
            hint: "Stor ring-op-knap + valgfri fast bund-bar på mobil. Driver opkald → leads."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - { name: note, label: Note, widget: string, required: false, i18n: true, hint: "Fx 'Vi svarer hverdage 7-17'." }
              - { name: phone, label: Telefonnummer, widget: string, required: false, hint: "Fx +45 12 34 56 78 — bruges til tel:-link." }
              - { name: label, label: Knap-tekst, widget: string, default: Ring nu, i18n: true }
              - { name: sticky_mobile, label: Fast bund-bar på mobil, widget: boolean, default: true, hint: "Til = altid-synlig ring-knap i bunden på mobil." }
          - name: reviews
            label: Anmeldelser
            widget: object
            hint: "Rigtige kundeanmeldelser med stjerner (fx fra Google). Indtast manuelt indtil videre."
            fields:
              - { name: heading, label: Overskrift, widget: string, required: false, i18n: true }
              - { name: show_rating, label: Vis stjerner, widget: boolean, default: true }
              - name: items
                label: Anmeldelser
                widget: list
                fields:
                  - { name: author, label: Navn, widget: string }
                  - { name: rating, label: Stjerner (1-5), widget: number, default: 5, min: 1, max: 5 }
                  - { name: text, label: Tekst, widget: text, required: false, i18n: true }
                  - { name: source, label: Kilde, widget: string, required: false, hint: "Fx 'Google' eller 'Trustpilot'." }
          - name: footer
            label: Footer
            widget: object
            hint: "Bunden af siden — firmanavn, adresse og links."
            fields:
              - { name: company, label: Firma, widget: string, i18n: duplicate }
              - { name: address, label: Adresse, widget: string, required: false, i18n: duplicate }
              - name: links
                label: Links
                widget: list
                fields:
                  - { name: label, label: Tekst, widget: string, i18n: true }
                  - { name: href, label: Link, widget: string }

  # Nyheder/blog — flad collection; markdown-body renderes. Kunder kan slette hele collection.
  - name: news
    label: Nyheder
    label_singular: Nyhed
    folder: src/content/news
    create: true
    format: yaml-frontmatter
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: Titel, widget: string }
      - { name: date, label: Dato, widget: datetime, picker_utc: false, format: "YYYY-MM-DD" }
      - { name: summary, label: Resumé, widget: text, required: false, hint: "Kort tekst der vises i oversigten over nyheder." }
      - { name: draft, label: Kladde, widget: boolean, default: false, hint: "Til = skjult på sitet (ikke publiceret endnu)." }
      - { name: publishAt, label: Planlagt udgivelse, widget: datetime, required: false, picker_utc: false, hint: "Valgfri — indlægget bliver synligt ved næste opdatering efter dette tidspunkt." }
      - { name: body, label: Indhold, widget: markdown }
